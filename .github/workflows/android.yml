name: Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 仓库未提交 gradle-wrapper.jar（二进制），CI 直接装一份 Gradle
      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip -O /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      # 产物名字里带上版本号（APK 本身在 gradle 里已改名，这里让下载包也带）
      - name: Read version
        id: ver
        run: echo "value=$(grep -o 'versionName = \"[^\"]*' android/app/build.gradle.kts | head -1 | cut -d'\"' -f2)" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: knee-rehab-v${{ steps.ver.outputs.value }}
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
